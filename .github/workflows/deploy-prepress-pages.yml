name: Deploy Prepress AI Tutor to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'prepress-ai-tutor/**'
      - '.github/workflows/deploy-prepress-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: prepress-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: prepress-ai-tutor
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
